# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  NGINX DO HOST — proxy reverso para a API                             ║
# ╚═══════════════════════════════════════════════════════════════════════╝
#
# Vai em  /etc/nginx/sites-available/ibvi-api  e é ligado com um link em
# sites-enabled. Ver o passo a passo em DEPLOY.md.
#
# Troque SUBDOMINIO.SEUDOMINIO.COM.BR pelo endereço que você criar. São
# QUATRO ocorrências: os dois `server_name` e os dois caminhos do certificado.
# (Um `grep -c` acusa cinco, porque conta também esta linha de comentário.)
#
# ═══ POR QUE NO HOST, E NÃO NUM CONTÊINER ═══
# Você já tem outro app nesta VPS ocupando 80 e 443. Este arquivo é só mais um
# `server` block ao lado do que já existe — o Nginx escolhe pelo `server_name`,
# e os dois convivem sem se enxergar.

# ─────────────────────────────────────────────────────────────────────────
# HTTP — existe só para redirecionar e para o certbot renovar
# ─────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name SUBDOMINIO.SEUDOMINIO.COM.BR;

    # O certbot precisa deste caminho servido em HTTP puro para provar que o
    # domínio é seu, inclusive nas renovações automáticas. Se ele cair dentro
    # do redirecionamento abaixo, a renovação falha calada e o certificado
    # vence em 90 dias — com o app fora do ar, porque ele exige HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────
# HTTPS — o que de fato atende
# ─────────────────────────────────────────────────────────────────────────
server {
    # ═══ HTTP/2 COMO PARÂMETRO DO `listen`, E NÃO `http2 on;` ═══
    # A diretiva separada `http2 on;` só existe a partir do nginx 1.25.1. Em
    # versões anteriores ela é "unknown directive" e o `nginx -t` reprova a
    # configuração inteira.
    #
    # O Ubuntu 24.04 traz o 1.24.0, então é esta a sintaxe que funciona aqui.
    # Ela continua válida nas versões novas — só emite aviso de obsoleta.
    # Entre quebrar no servidor e receber um aviso, o aviso é melhor.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name SUBDOMINIO.SEUDOMINIO.COM.BR;

    ssl_certificate     /etc/letsencrypt/live/SUBDOMINIO.SEUDOMINIO.COM.BR/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SUBDOMINIO.SEUDOMINIO.COM.BR/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ═══ HSTS ═══
    # Diz ao aparelho: "deste domínio, só me procure por HTTPS pelos próximos
    # dois anos". É a outra metade da trava que pusemos no app — mesmo que
    # alguém aponte para http://, o celular corrige antes de sair.
    #
    # ⚠️  Só ligue depois que o HTTPS estiver comprovadamente funcionando. O
    # navegador MEMORIZA isso, e voltar atrás leva meses.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # O Express já manda `helmet`, mas quem responde erro de proxy é o Nginx —
    # e essas respostas não passam pelo Express.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Esconde a versão do Nginx nas páginas de erro.
    server_tokens off;

    # Upload de foto de perfil. O app comprime antes de enviar e o multer
    # recusa acima de 8 MB; 10 aqui deixa a recusa acontecer no lugar certo,
    # com a mensagem em português, em vez de virar um 413 seco do Nginx.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # ═══ ESTE CABEÇALHO NÃO É DETALHE ═══
        # É por ele que o Express enxerga o IP real de quem chamou. Sem ele,
        # toda requisição parece vir do próprio servidor, e o limitador de
        # tentativas de login trataria a internet inteira como um cliente só —
        # bloqueando a igreja de uma vez.
        #
        # Casa com o `app.set("trust proxy", 1)` que já está no server.ts.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # A verificação de saúde não precisa entupir o log de acesso.
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
